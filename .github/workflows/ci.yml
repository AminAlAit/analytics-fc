name: Analytics FC CI Quality Pipeline

on:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: Code Quality & Automated Test Gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pytest httpx dbt-duckdb dvc prefect pyyaml evidently

      - name: Run Ruff Lint Checks
        run: |
          ruff check .

      - name: Run Ruff Format Verification
        run: |
          ruff format --check .

      - name: Run Mypy Static Type Checking
        run: |
          mypy

      - name: Seed CI Test Fixtures
        run: |
          python scripts/seed_ci_fixtures.py

      - name: Run dbt Model Build
        run: |
          dbt run --project-dir dbt_project --profiles-dir dbt_project --threads 1

      - name: Run dbt Data Quality Tests
        run: |
          dbt test --project-dir dbt_project --profiles-dir dbt_project --threads 1

      - name: Run Automated Test Suite
        run: |
          pytest -v tests/test_ruff_config.py tests/test_mypy_config.py tests/test_ci_workflow.py tests/test_architecture_sync.py tests/test_pipeline_gate.py tests/test_drift_config.py tests/test_drift_analyzer.py tests/test_dashboard_drift.py tests/test_trajectory_predictor.py tests/test_trajectory_dataset.py tests/test_trajectory_regressor.py
